color:
  palette:
    navy: "#030A5F"
    lime: "#BBF81B"
    green: lime
    magenta: "#EB4FEE"
    purple: "#6B2F8E"
    blue: "#0B70D5"
    indigo: "#4D44AA"
    pink: "#C114C8"
    plum: "#7B0D84"
    ice: "#F5FAFF"
    faq-card: "#E0F0FF"
    muted: "#4A5578"
    session-fg: "#F3E8FF"
    event-bg: "#E9E9E9"
    red: "#D0342C"
    orange: "#FF8A3D"
    yellow: "#FFD43B"
    teal: "#1FA99C"
    cyan: "#419CF5"
    gray: "#909090"
    black: "#151515"
    white: "#FFFFFF"

  foreground:
    light: navy
    dark: "#E7EEFF"
  background:
    light: white
    dark: "#0D1128"
  primary: blue
  secondary: navy
  success: "#2C7A4B"
  info: cyan
  warning: lime
  danger: "#D0342C"
  light: ice
  dark: black

typography:
  fonts:
    - family: Source Sans Pro
      source: google
      weight: [400, 600, 700]
      style: [normal, italic]
    - family: Open Sans
      source: google
      weight: [400, 500, 600, 700, 800]
      style: [normal, italic]
  base:
    family: Source Sans Pro
    size: 16px
    line-height: 1.5
  headings:
    family: Open Sans
    weight: 700
    color: navy
  monospace:
    family: Source Code Pro
    size: 0.9em

meta:
  name: "posit::conf(2026)"
  link: https://conf.posit.co/2026/

defaults:
  shiny:
    theme:
      defaults:
        font-size-base: 1rem
        border-radius: 0.5rem
        link-color: $brand-blue
        link-hover-color: $brand-navy
        navbar-bg: $brand-cyan
        navbar-fg: $brand-white
        navbar-link-fg: $brand-white
        navbar-link-hover-fg: $brand-lime
      rules: |
        :root {
          --brand-faq-card: #{$brand-faq-card};
          --brand-session-fg: #{$brand-session-fg};
          --brand-event-bg: #{$brand-event-bg};
          --brand-nav-link-hover-bg: color-mix(
            in srgb,
            #{$brand-navy} 18%,
            transparent
          );
          --chat-bg-image: url("pixel-fade.svg");
        }

        shiny-chat-container {
          --shiny-chat-btn-send-bg: var(--brand-lime, #ffc107);
          --shiny-chat-btn-send-color: var(--brand-navy, var(--bs-dark, #212529));
          --shiny-chat-btn-send-bg-hover: var(--brand-navy, var(--bs-dark, #212529));
          --shiny-chat-btn-send-color-hover: var(--brand-lime, #ffc107);
          --shiny-chat-btn-send-color-cancel: var(--brand-pink, #d63384);
          --shiny-chat-footer-color: var(--brand-gray, var(--bs-gray-500));
          --_user-message-bg: var(
            --shiny-chat-user-message-bg,
            rgba(var(--bs-primary-rgb, 0, 123, 194), 0.16)
          );
        }

        [data-bs-theme="dark"] shiny-chat-container .shiny-chat-suggestion-list .shiny-chat-suggestion-list-item {
          background-color: #22306B;
          color: #CFE3FF;
        }

        [data-bs-theme="dark"] .shiny-chat-page-sidebar {
          background-color: #121A3E;
          color: #E7EEFF;
        }

        [data-bs-theme="dark"] {
          --bs-heading-color: #E7EEFF;
          --bs-link-color: $brand-cyan;
          --bs-link-hover-color: #8FC3F9;
        }

        .conf-card-keynote {
          color: #E7EEFF;
        }

        .conf-card-keynote .conf-muted,
        .conf-card-keynote .text-muted {
          color: #9DB4E4 !important;
        }

        .conf-card-keynote .conf-chip-track {
          box-shadow: inset 0 0 0 1px rgba(187, 248, 27, 0.55);
        }

        .conf-card-keynote .conf-session-talks,
        .conf-card-keynote .conf-session-talk+.conf-session-talk {
          border-top-color: rgba(231, 238, 255, 0.16);
        }

        [data-bs-theme="dark"] .conf-card:not(.conf-card-keynote) {
          background: #1A2142;
          color: #E7EEFF;
        }

        [data-bs-theme="dark"] .conf-card:not(.conf-card-keynote) .conf-muted {
          color: #9DB4E4;
        }

        [data-bs-theme="dark"] .conf-card:not(.conf-card-keynote) .conf-session-talks,
        [data-bs-theme="dark"] .conf-card:not(.conf-card-keynote) .conf-session-talk+.conf-session-talk {
          border-top-color: rgba(231, 238, 255, 0.14);
        }

        [data-bs-theme="dark"] .conf-chip-talk {
          background: #22306B;
          color: #CFE3FF;
        }

        [data-bs-theme="dark"] .conf-chip-event,
        [data-bs-theme="dark"] .conf-chip-inperson {
          background: #2A3358;
          color: #E7EEFF;
        }

        [data-bs-theme="dark"] .conf-chip-track {
          color: #AEB8F5;
          box-shadow: inset 0 0 0 1px #AEB8F5;
        }

        [data-bs-theme="dark"] .conf-muted {
          color: #9DB4E4;
        }

        [data-bs-theme="dark"] .conf-card-keynote {
          background: #0A1450;
          border-color: rgba(187, 248, 27, 0.3);
        }

        [data-bs-theme="dark"] .full-schedule-filters .control-label {
          color: $brand-lime;
        }

        /* Frosted background behind the composer so the chat input and input
           toolbar stay readable over the background artwork. Hugs the
           composer box exactly — no padding offset. */
        .shiny-chat-composer {
          background: color-mix(in srgb, var(--bs-body-bg) 80%, transparent);
          backdrop-filter: blur(6px);
          -webkit-backdrop-filter: blur(6px);
          border-radius: var(--bs-border-radius-lg, 0.75rem);

          .shiny-chat-input-toolbar {
            padding-left: 0.5em;
            padding-bottom: 0.25em;
          }
        }
